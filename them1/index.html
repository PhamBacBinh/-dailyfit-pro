<style>
:root{--bg:#F4F4F4;--surface:#fff;--ink:#111111;--muted:#6B6B6B;--line:#E2E2E2;--accent:#D7262E;--on-accent:#fff;--soft:#FBE3E4;--gold:#8C1218;--gold-soft:#FBE3E4;--danger:#D7262E;--hero:#111111;--hero-line:#333;--hero-sub:#BDBDBD;--hero-red:#FF3B44;--h0:#EDEDED;--h1:#F3C2C4;--h2:#E5767B;--h3:#D7262E;--h4:#8C1218;--num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0B0B0B;--surface:#171717;--ink:#F2F2F2;--muted:#9A9A9A;--line:#2A2A2A;--accent:#FF3B44;--on-accent:#fff;--soft:#3A1416;--gold:#FF6A70;--gold-soft:#3A1416;--danger:#FF3B44;--hero:#171717;--hero-line:#2A2A2A;--hero-sub:#9A9A9A;--hero-red:#FF3B44;--h0:#222222;--h1:#4A1418;--h2:#8E1D23;--h3:#D7262E;--h4:#FF6A70}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}

.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 8px;max-width:640px;margin:0 auto}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
#syncBadge{font-size:13px;color:var(--muted)}
main{padding:0 16px;max-width:640px;margin:0 auto;display:grid;gap:12px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}

.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center;padding:8px 0 16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}

.xl{font-size:64px;line-height:1;letter-spacing:-.03em}
.hero .u{font-size:18px;color:var(--hero-red);font-weight:600}.hero .red{color:var(--hero-red)}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:12px}
.hero-row b{display:block;font-size:24px}.hero-row span{font-size:12.5px;color:var(--hero-sub);line-height:1.25;display:block}
.week{grid-template-columns:116px 1fr;align-items:center;gap:16px}
.ring{width:116px;height:116px}.ring-bg{fill:none;stroke:var(--soft);stroke-width:12}.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-t{font-size:24px;text-anchor:middle;fill:var(--ink)}.ring-s{font-size:11px;text-anchor:middle;fill:var(--muted)}
.week-info{display:grid;gap:2px}.week-info b{font-size:22px}
.heat,.chart{width:100%;height:auto;display:block}.ax{font-size:9px;fill:var(--muted)}
.h-1{fill:transparent}.h0{fill:var(--h0)}.h1{fill:var(--h1)}.h2{fill:var(--h2)}.h3{fill:var(--h3)}.h4{fill:var(--h4)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);justify-content:flex-end;flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .h0{background:var(--h0)}.legend .h1{background:var(--h1)}.legend .h2{background:var(--h2)}.legend .h3{background:var(--h3)}.legend .h4{background:var(--h4)}
.legend .lv{background:var(--accent);height:3px;width:16px;margin-left:8px}.legend .lt{border-top:2px dashed var(--ink);height:0;width:16px;border-radius:0;margin-left:8px}
.gl{stroke:var(--line);stroke-width:1}.val{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.val-d{fill:var(--accent)}.tg{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}.seg button{flex:1;min-height:36px;border:0;background:none;color:var(--muted);border-radius:8px;font:inherit;font-size:14px}.seg .on{background:var(--surface);color:var(--ink);font-weight:600}
.pr,.logs,.exlist{list-style:none;padding:0;display:grid}
.pr li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:8px 0;border-top:1px solid var(--line)}.pr li:first-child{border-top:0}.pr small{color:var(--muted);text-align:right}.pr b{text-align:right}.pr li small:nth-child(3){grid-column:2}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats3 b{display:block;font-size:24px}.stats3 span{font-size:12.5px;color:var(--muted);display:block}.tag{font-style:normal;font-size:12.5px;color:var(--accent);font-weight:600}

.btn:active{transform:scale(.97)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.danger{color:var(--danger)}.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}.btn.icon{width:44px;padding:0;font-size:22px}.btn.round{width:52px;height:52px;border-radius:50%;font-size:26px;padding:0}.btn:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%}
input[type=date]{-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--accent)}
.counter{display:flex;align-items:center;gap:12px}.counter .big{font-size:40px;min-width:64px;text-align:center}.counter .btn:last-child{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:14px;font-family:var(--num);font-weight:600}
.ex.ok{border-color:var(--accent)}
.badge{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}.badge.pr{background:var(--gold-soft);color:var(--gold)}
.target{font-size:15px}.target b{font-size:18px}.done{margin-left:6px}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.runner{display:grid;gap:16px;text-align:center;padding:8px 0}
.clock{font-size:min(26vw,128px);line-height:1;letter-spacing:-.04em;margin:8px 0}.clock.sm{font-size:56px;margin:0}
.runner.running .clock{color:var(--accent)}.runner.paused .clock{opacity:.55}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s linear}
.run-btns{display:grid;grid-auto-flow:column;gap:10px}.xl-btn{min-height:64px;font-size:19px;border-radius:18px}
.switch{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px}
.logs li,.exlist li{display:grid;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.logs li{grid-template-columns:1fr auto auto auto}.exlist li{grid-template-columns:1fr auto auto}
.logs li:first-child,.exlist li:first-child{border-top:0}.logs li div,.exlist li div{display:grid}.logs .muted,.exlist .muted{font-size:13px}.kc{font-size:14px;color:var(--muted)}.exlist li.off b{opacity:.5}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;display:grid;justify-items:center;gap:2px;padding:8px 0 6px;min-height:56px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tabs .on{color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
details{font-size:14px;display:grid;gap:10px}summary{color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.hr{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 2}.legend .hr-l{border:1.5px dashed var(--muted);margin-left:8px}
.mnav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;text-align:center}.mnav h2{font-size:17px}
.delta{font-size:12.5px;font-weight:600;display:block}.delta.up{color:var(--accent)}.delta.down{color:var(--danger)}
.mlist{list-style:none;padding:0;display:grid}.mlist li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}.mlist li:first-child{border-top:0}
.restbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.restbar.on{border-color:var(--muted);border-style:dashed}
.runfull{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:22px;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));text-align:center}
.runfull .clock{font-size:min(28vw,180px);color:#FF3B44;margin:0}.runfull.paused .clock{opacity:.5}.runfull .lbl{font-size:18px;color:#BDBDBD}.runfull .tgt{font-size:20px;color:#fff}
.runfull .bar{background:#2A2A2A;height:12px}.runfull .bar i{background:#FF3B44}.runfull .btn{background:#1A1A1A;border-color:#333;color:#fff}.runfull .btn.primary{background:#D7262E;border-color:#D7262E}.runfull .min{background:none;border:0;color:#9A9A9A;font:inherit;font-size:15px;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const KEY='ft_data',RUNKEY='ft_run',TOKKEY='ft_token',GISTKEY='ft_gist',DIRTY='ft_dirty',LASTSYNC='ft_lastsync',GFILE='them1-data.json';
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const weekStart=s=>addDays(s,-((parseD(s).getDay()+6)%7));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:d});
const round1=n=>Math.round(n*10)/10;
const fmtDate=s=>{const d=parseD(s);return ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1);};
const mmss=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):pad(m))+':'+pad(s);};
const parseSets=s=>String(s).split(/[^0-9]+/).map(Number).filter(n=>n>0);
const sum=a=>a.reduce((x,y)=>x+y,0);
const num=v=>parseFloat(String(v==null?'':v).trim().replace(/\s/g,'').replace(',','.'));
const SCHEMA=3;

const RUN_INT={'Nhẹ':7.0,'Vừa':9.8,'Nhanh':11.5};
const MET_PRESETS=[['Squat',5.0,'reps',2],['Gập bụng',3.8,'reps',2],['Chùng chân (lunge)',4.0,'reps',2],['Burpee',8.0,'reps',4],['Nhảy dang tay chân',7.7,'reps',1],['Leo núi tại chỗ',8.0,'reps',1],['Chống tay sau (dips)',5.0,'reps',3],['Plank',3.8,'time',0],['Nhảy dây',11.8,'time',0],['Đạp xe vừa',7.5,'time',0],['Đi bộ nhanh',4.3,'time',0],['Bơi',6.0,'time',0],['Leo cầu thang',8.8,'time',0],['Yoga',2.5,'time',0],['Tạ tay',5.0,'reps',3]];

/* ---------- Dữ liệu ---------- */
let D;
function defaults(){return {schemaVersion:SCHEMA,profile:null,weights:[],rests:[],
 exercises:[
  {id:'pushup',name:'Chống đẩy',type:'reps',met:3.8,secPerRep:2,increment:1,hidden:false,updatedAt:0},
  {id:'pullup',name:'Lên xà',type:'reps',met:8.0,secPerRep:3,increment:1,hidden:false,updatedAt:0},
  {id:'run',name:'Chạy bộ',type:'time',met:9.8,secPerRep:0,increment:1,hidden:false,intensities:RUN_INT,updatedAt:0}],
 logs:[],deleted:[],settings:{weeklyGoalMin:150,wakeLock:true,targetSound:true,holdRule:true,reminderTime:'19:00',lockScreen:false,iosTimer:true,shortcutName:'Bắt đầu hẹn giờ',runFull:true,firstTimerMin:30,updatedAt:0}};}
function load(){try{D=JSON.parse(localStorage.getItem(KEY));}catch(e){D=null;}if(!D||!D.schemaVersion)D=defaults();migrate();}
function migrate(){const d=defaults();for(const k of ['weights','exercises','logs','deleted','rests'])if(!Array.isArray(D[k]))D[k]=d[k];if(!D.settings)D.settings=d.settings;
 /* v1 → v2: thêm ngày nghỉ, âm báo, quy tắc giữ mức, giờ nhắc */
 if((D.schemaVersion||1)<3){/* v3: khung Đang phát làm dừng nhạc → tắt; bật Hẹn giờ iPhone + màn hình chạy toàn màn hình */D.settings.lockScreen=false;D.settings.iosTimer=true;}
 for(const k in d.settings)if(D.settings[k]===undefined)D.settings[k]=d.settings[k];if(D.settings.shortcutName==='Them1 Hen gio')D.settings.shortcutName='Bắt đầu hẹn giờ';D.schemaVersion=SCHEMA;}
function save(sync=true){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('Bộ nhớ máy đầy. Hãy xuất file sao lưu.');}if(sync&&localStorage.getItem(TOKKEY)){localStorage.setItem(DIRTY,'1');scheduleSync();}}
const exById=id=>D.exercises.find(e=>e.id===id);
const unit=e=>e.type==='reps'?'lần':'phút';
const fv=(e,v)=>e.type==='reps'?fmt(v):fmt(v,1);
function weightAt(date){let w=null;for(const x of D.weights)if(x.date<=date&&(!w||x.date>w.date))w=x;if(!w)for(const x of D.weights)if(!w||x.date<w.date)w=x;return w?w.kg:null;}
function kcalOf(l){return (l.met||0)*3.5*(weightAt(l.date)||0)/200*(l.durationSec/60);}
function value(l){const e=exById(l.exerciseId);return e&&e.type==='reps'?sum(l.sets||[]):l.durationSec/60;}
function bmr(){const p=D.profile,w=weightAt(today());if(!p||!w)return 0;const age=new Date().getFullYear()-p.birthYear;return 10*w+6.25*p.heightCm-5*age+(p.sex==='nam'?5:-161);}
function stats(){const days={};for(const l of D.logs){const d=days[l.date]||(days[l.date]={ex:{},kcal:0,min:0});d.ex[l.exerciseId]=(d.ex[l.exerciseId]||0)+value(l);d.kcal+=kcalOf(l);d.min+=l.durationSec/60;}return days;}
const PC=new WeakMap();
function nextTarget(prev,e){const n=prev.length;if(!n)return {v:null,hold:false};const a=prev[n-1],b=prev[n-2],hold=!!(D.settings.holdRule&&b&&a.miss&&b.miss);return {v:hold?a.v:a.v+e.increment,hold};}
function sessions(id,days){let m=PC.get(days);if(!m){m={};PC.set(days,m);}if(m[id])return m[id];const e=exById(id),out=[];
 for(const d of Object.keys(days).filter(d=>days[d].ex[id]!=null).sort()){const v=days[d].ex[id],t=nextTarget(out,e).v;out.push({d,v,t,miss:t!=null&&v<t-1e-9});}return m[id]=out;}
function targetInfo(id,date,days){const e=exById(id);return e?nextTarget(sessions(id,days).filter(s=>s.d<date),e):{v:null,hold:false};}
function targetFor(id,date,days){return targetInfo(id,date,days).v;}
function prBefore(id,date,days){let m=0;for(const d in days)if(d<date&&days[d].ex[id]>m)m=days[d].ex[id];return m;}
const restSet=()=>new Set(D.rests.map(r=>r.date));
function streaks(days){const rs=restSet(),ok=d=>!!days[d]||rs.has(d);let cur=0,d=today();if(!ok(d))d=addDays(d,-1);while(ok(d)){if(days[d])cur++;d=addDays(d,-1);}
 let best=0,run=0,prev=null;for(const x of [...new Set([...Object.keys(days),...rs])].sort()){run=prev&&addDays(prev,1)===x?run:0;if(days[x])run++;if(run>best)best=run;prev=x;}return {cur,best:Math.max(best,cur)};}
function restsInWeek(date,exceptDate){const ws=weekStart(date),we=addDays(ws,6);return D.rests.filter(r=>r.date>=ws&&r.date<=we&&r.date!==exceptDate).length;}
function lastSet(id){let l=null;for(const x of D.logs)if(x.exerciseId===id&&x.sets&&x.sets.length&&(!l||x.date>l.date||(x.date===l.date&&x.updatedAt>l.updatedAt)))l=x;return l?l.sets[l.sets.length-1]:0;}
function logText(e,l){if(!e)return '';return e.type==='reps'?l.sets.join('-')+' = '+sum(l.sets)+' lần':mmss(l.durationSec)+(l.intensity?', '+l.intensity:'');}

/* ---------- Giao diện ---------- */
let tab='dash',logDate=today(),chartEx=null,chartRange=30,runEx='run',histLimit=30,repMonth=today().slice(0,7);
const draft={};
const TITLES={dash:'Tổng quan',log:'Ghi nhận',run:'Chạy bộ',hist:'Lịch sử',set:'Cài đặt'};
function go(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$('#title').textContent=TITLES[t];render();window.scrollTo(0,0);}
function render(){const nv=$('.tabs');if(nv)nv.style.display=D.profile?'':'none';if(!D.profile){$('#title').textContent='Chào mừng';$('#view').innerHTML=vOnboard();return;}$('#view').innerHTML=({dash:vDash,log:vLog,run:vRun,hist:vHist,set:vSet})[tab]();}

function vDash(){const days=stats(),t=today(),td=days[t]||{ex:{},kcal:0,min:0},vis=D.exercises.filter(e=>!e.hidden);
 let done=0;for(const e of vis){const tg=targetFor(e.id,t,days),v=td.ex[e.id]||0;if(v>0&&(tg==null||v>=tg-1e-9))done++;}
 const ws=weekStart(t);let wmin=0,wkc=0;for(let i=0;i<7;i++){const d=days[addDays(ws,i)];if(d){wmin+=d.min;wkc+=d.kcal;}}
 const goal=D.settings.weeklyGoalMin||150,p=Math.min(1,wmin/goal),C=2*Math.PI*52,st=streaks(days);
 if(!chartEx||!vis.some(e=>e.id===chartEx))chartEx=vis[0]&&vis[0].id;
 return `<section class="hero">
  <div class="hero-main"><span class="lbl">Hôm nay tiêu hao</span><b class="num xl">${fmt(td.kcal)}</b><span class="u">kcal</span></div>
  <div class="hero-row"><div><b class="num">${fmt(td.min)}</b><span>phút vận động</span></div><div><b class="num">${done}/${vis.length}</b><span>môn đạt mục tiêu</span></div><div><b class="num red">${st.cur}</b><span>ngày liên tiếp</span></div></div>
 </section>
 <section class="card week">
  <svg viewBox="0 0 120 120" class="ring" role="img" aria-label="Tiến độ tuần ${Math.round(p*100)}%"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)"/><text x="60" y="62" class="num ring-t">${Math.round(p*100)}%</text><text x="60" y="80" class="ring-s">tuần này</text></svg>
  <div class="week-info"><h2>Mục tiêu tuần</h2><p><b class="num">${fmt(wmin)}</b> / ${goal} phút</p><p class="muted small">${fmt(wkc)} kcal tuần này</p><p class="muted small">Chuỗi dài nhất: ${st.best} ngày</p></div>
 </section>
 <section class="card"><h2>12 tuần gần nhất</h2>${heatmap(days)}</section>
 <section class="card"><div class="row-between"><h2>Tiến bộ</h2>${vis.length?`<select data-on="chartEx" style="width:auto">${vis.map(e=>`<option value="${e.id}" ${e.id===chartEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`:''}</div>
  <div class="seg">${[7,30,90].map(n=>`<button data-act="range" data-n="${n}" class="${n===chartRange?'on':''}">${n} ngày</button>`).join('')}</div>${progressChart(days)}</section>
 <section class="card"><h2>Kỷ lục cá nhân</h2>${prList(days,vis)}</section>
 ${weightCard()}
 ${monthCard(days)}`;}

function heatmap(days){const t=today(),start=addDays(weekStart(t),-77),S=14,G=3,cells=[],rs=restSet();let mx=0,s='';
 for(let i=0;i<84;i++){const d=addDays(start,i),k=days[d]?days[d].kcal:0;if(k>mx)mx=k;cells.push([d,k]);}
 cells.forEach(([d,k],i)=>{const c=Math.floor(i/7),r=i%7,lv=d>t?-1:k>0?Math.min(4,Math.max(1,Math.ceil(k/mx*4))):rs.has(d)?'r':0;
  s+=`<rect x="${c*(S+G)+20}" y="${r*(S+G)}" width="${S}" height="${S}" rx="3" class="h${lv}"><title>${fmtDate(d)}: ${fmt(k)} kcal</title></rect>`;});
 const lab=['T2','','T4','','T6','','CN'].map((l,r)=>`<text x="0" y="${r*(S+G)+11}" class="ax">${l}</text>`).join('');
 return `<svg viewBox="0 0 ${12*(S+G)+20} ${7*(S+G)}" class="heat" role="img" aria-label="Lịch tập 12 tuần">${lab}${s}</svg><div class="legend">Ít <i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i> Nhiều kcal <i class="hr-l"></i> Nghỉ</div>`;}

function chart(series,o){const W=320,H=160,L=36,R=10,T=10,B=22,ys=series.flatMap(s=>s.pts.map(p=>p[1]));
 if(!ys.length)return '<p class="empty">Chưa có dữ liệu trong khoảng này.</p>';
 let mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn){mx+=1;mn-=1;}const pd=(mx-mn)*.12;mx+=pd;mn=Math.max(o.floor==null?-Infinity:o.floor,mn-pd);
 const X=i=>L+(o.n<=1?.5:i/(o.n-1))*(W-L-R),Y=y=>T+(1-(y-mn)/(mx-mn))*(H-T-B);let s='';
 for(let k=0;k<=3;k++){const y=mn+(mx-mn)*k/3;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" class="gl"/><text x="${L-5}" y="${(Y(y)+3).toFixed(1)}" class="ax" text-anchor="end">${fmt(y,o.dec)}</text>`;}
 s+=`<text x="${L}" y="${H-5}" class="ax">${o.x0}</text><text x="${W-R}" y="${H-5}" class="ax" text-anchor="end">${o.x1}</text>`;
 for(const se of series){if(!se.pts.length)continue;s+=`<path d="${se.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('')}" class="${se.cls}"/>`;
  if(se.dots)s+=se.pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3" class="${se.cls}-d"/>`).join('');}
 return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;}

function progressChart(days){const e=exById(chartEx);if(!e)return '<p class="empty">Thêm bộ môn trong Cài đặt để xem tiến bộ.</p>';
 const t=today(),s0=addDays(t,-(chartRange-1)),v=[],g=[];
 for(let i=0;i<chartRange;i++){const d=addDays(s0,i),val=days[d]&&days[d].ex[e.id];if(val!=null){v.push([i,val]);const tg=targetFor(e.id,d,days);if(tg!=null)g.push([i,tg]);}}
 return chart([{pts:g,cls:'tg'},{pts:v,cls:'val',dots:true}],{n:chartRange,x0:fmtDate(s0),x1:'Hôm nay',dec:e.type==='reps'?0:1,floor:0})+`<div class="legend"><i class="lv"></i> Kết quả (${unit(e)}) <i class="lt"></i> Mục tiêu</div>`;}

function prList(days,vis){if(!vis.length)return '<p class="muted">Chưa có bộ môn.</p>';
 return `<ul class="pr">${vis.map(e=>{let m=0,md=null;for(const d in days){const v=days[d].ex[e.id];if(v>m){m=v;md=d;}}
  return md?`<li><span>${esc(e.name)}</span><b class="num">${fv(e,m)} ${unit(e)}</b><small>${fmtDate(md)}</small></li>`:`<li><span>${esc(e.name)}</span><small>Chưa có</small></li>`;}).join('')}</ul>`;}

function weightCard(){const w=weightAt(today()),p=D.profile;if(!w||!p)return '';const h=p.heightCm/100,bmi=w/(h*h);
 const cls=bmi<18.5?'Thiếu cân':bmi<23?'Bình thường':bmi<25?'Thừa cân':'Béo phì';
 const ws=[...D.weights].sort((a,b)=>a.date<b.date?-1:1),f=ws[0].date,n=dayDiff(f,today())+1;
 return `<section class="card"><div class="row-between"><h2>Cân nặng</h2><button class="btn sm" data-act="weightOpen">Cập nhật</button></div>
 <div class="stats3"><div><b class="num">${fmt(w,1)}</b><span>kg</span></div><div><b class="num">${fmt(bmi,1)}</b><span>BMI, chuẩn châu Á</span><em class="tag">${cls}</em></div><div><b class="num">${fmt(bmr())}</b><span>BMR kcal/ngày</span></div></div>
 ${ws.length>1?chart([{pts:ws.map(x=>[dayDiff(f,x.date),x.kg]),cls:'val',dots:true}],{n:Math.max(n,2),x0:fmtDate(f),x1:'Hôm nay',dec:1}):'<p class="muted small">Cập nhật cân nặng định kỳ để xem xu hướng.</p>'}</section>`;}

function monthStats(ym,days){const [y,m]=ym.split('-').map(Number),s=ym+'-01',e=ymd(new Date(y,m,0));let k=0,mi=0,ad=0;const per={};
 for(const d in days){if(d<s||d>e)continue;ad++;k+=days[d].kcal;mi+=days[d].min;for(const id in days[d].ex)per[id]=(per[id]||0)+days[d].ex[id];}return {s,e,k,mi,ad,per};}
function monthCard(days){const cur=monthStats(repMonth,days),[y,m]=repMonth.split('-').map(Number),prevYm=ymd(new Date(y,m-2,1)).slice(0,7),pv=monthStats(prevYm,days),t=today();
 let prs=0;for(const ex of D.exercises){let mx=0;for(const se of sessions(ex.id,days)){if(se.v>mx){if(mx>0&&se.d>=cur.s&&se.d<=cur.e)prs++;mx=se.v;}}}
 const rests=D.rests.filter(r=>r.date>=cur.s&&r.date<=cur.e).length,end=cur.e<t?cur.e:t,w0=weightAt(cur.s),w1=weightAt(end);
 const dl=(a,b)=>b>0?`<span class="delta ${a>=b?'up':'down'}">${a>=b?'+':''}${fmt((a-b)/b*100)}% so với tháng trước</span>`:'';
 const rows=D.exercises.filter(x=>cur.per[x.id]).map(x=>`<li><span>${esc(x.name)}</span><b class="num">${fv(x,cur.per[x.id])} ${unit(x)}</b></li>`).join('');
 return `<section class="card"><div class="mnav"><button class="btn icon" data-act="monthShift" data-n="-1" aria-label="Tháng trước">‹</button><h2>Báo cáo tháng ${m}/${y}</h2><button class="btn icon" data-act="monthShift" data-n="1" aria-label="Tháng sau" ${repMonth>=t.slice(0,7)?'disabled':''}>›</button></div>
 <div class="stats3"><div><b class="num">${fmt(cur.k)}</b><span>kcal</span>${dl(cur.k,pv.k)}</div><div><b class="num">${fmt(cur.mi)}</b><span>phút vận động</span>${dl(cur.mi,pv.mi)}</div><div><b class="num">${cur.ad}</b><span>ngày tập, ${rests} ngày nghỉ</span></div></div>
 <div class="stats3"><div><b class="num">${prs}</b><span>kỷ lục mới</span></div><div><b class="num">${w0&&w1?(w1-w0>0?'+':'')+fmt(w1-w0,1):'–'}</b><span>kg trong tháng</span></div><div><b class="num">${w1?fmt(w1,1):'–'}</b><span>kg cuối kỳ</span></div></div>
 ${rows?`<ul class="mlist">${rows}</ul>`:'<p class="muted small">Tháng này chưa có buổi tập.</p>'}</section>`;}

function vLog(){const days=stats(),vis=D.exercises.filter(e=>!e.hidden),d=logDate;
 return `<div class="datebar"><button class="btn icon" data-act="dateShift" data-n="-1" aria-label="Ngày trước">‹</button><input type="date" value="${d}" max="${today()}" data-on="logDate" aria-label="Ngày ghi nhận"><button class="btn icon" data-act="dateShift" data-n="1" aria-label="Ngày sau" ${d>=today()?'disabled':''}>›</button></div>`
 +restBar(d,days)+(vis.length?vis.map(e=>exCard(e,d,days)).join(''):'<p class="empty">Chưa có bộ môn. Vào Cài đặt để thêm.</p>');}
function restBar(d,days){const on=restSet().has(d);if(days[d]&&!on)return '';
 return `<section class="card restbar ${on?'on':''}"><div><h2>${on?'Ngày nghỉ chủ động':'Hôm nay nghỉ?'}</h2><p class="muted small">${on?'Chuỗi ngày tập được giữ nguyên.':'Tối đa 1 ngày nghỉ mỗi tuần, không làm đứt chuỗi.'}</p></div><button class="btn sm" data-act="restToggle" data-date="${d}">${on?'Bỏ ngày nghỉ':'Đánh dấu nghỉ'}</button></section>`;}

function exCard(e,d,days){const ti=targetInfo(e.id,d,days),tg=ti.v,v=days[d]&&days[d].ex[e.id]||0,pr=prBefore(e.id,d,days),ok=v>0&&(tg==null||v>=tg-1e-9),isPR=v>0&&pr>0&&v>pr;
 const logs=D.logs.filter(l=>l.date===d&&l.exerciseId===e.id);let body;
 if(e.type==='reps'){const dr=draft[e.id]||(draft[e.id]={cur:lastSet(e.id)||10,sets:[]});
  body=`<div class="counter"><button class="btn round" data-act="dec" data-ex="${e.id}" aria-label="Giảm">−</button><b class="num big">${dr.cur}</b><button class="btn round" data-act="inc" data-ex="${e.id}" aria-label="Tăng">+</button><button class="btn" data-act="addSet" data-ex="${e.id}">Thêm hiệp</button></div>
  <div class="chips">${dr.sets.map((s,i)=>`<button class="chip" data-act="rmSet" data-ex="${e.id}" data-i="${i}" aria-label="Xóa hiệp ${s}">${s} ×</button>`).join('')||'<span class="muted small">Chưa thêm hiệp. Bấm Lưu sẽ ghi số đang chọn là 1 hiệp.</span>'}</div>
  <label class="fld">Hoặc nhập nhanh các hiệp<input inputmode="numeric" placeholder="vd 20-18-15" value="${dr.sets.join('-')}" data-on="setsText" data-ex="${e.id}"></label>
  <label class="fld">Thời gian thực tế (không bắt buộc)<select id="dur-${e.id}"><option value="">Tự ước tính ${fmt(e.secPerRep,1)} giây/lần</option>${opts(1,60,1,-1,0)}</select></label>
  <button class="btn primary full" data-act="saveReps" data-ex="${e.id}">Lưu ${esc(e.name.toLowerCase())}</button>`;}
 else{body=`<div class="two"><label class="fld">Thời gian (phút)<select id="min-${e.id}">${opts(1,180,1,Math.round(tg!=null?tg:15),0)}</select></label>${e.intensities?`<label class="fld">Cường độ<select id="int-${e.id}">${Object.keys(e.intensities).map(k=>`<option ${k==='Vừa'?'selected':''}>${k}</option>`).join('')}</select></label>`:''}</div>
  <div class="two"><button class="btn" data-act="toRun" data-ex="${e.id}">Bấm giờ</button><button class="btn primary" data-act="saveTime" data-ex="${e.id}">Lưu</button></div>`;}
 return `<section class="card ex ${ok?'ok':''}" data-card="${e.id}"><div class="row-between"><h2>${esc(e.name)}</h2>${isPR?'<span class="badge pr">Kỷ lục mới</span>':ok?'<span class="badge">Đạt mục tiêu</span>':''}</div>
 <p class="target">${tg==null?'Buổi đầu tiên: đặt mốc của bạn':ti.hold?`Giữ mức: <b class="num">${fv(e,tg)}</b> ${unit(e)} <span class="muted small">(2 buổi gần nhất chưa đạt, chưa tăng)</span>`:`Mục tiêu: <b class="num">${fv(e,tg)}</b> ${unit(e)} <span class="muted">(+${fv(e,e.increment)})</span>`}${v?`<span class="done muted">Đã làm: <b class="num">${fv(e,v)}</b></span>`:''}</p>
 ${logs.length?`<p class="muted small">${logs.map(l=>logText(e,l)).join('; ')}</p>`:''}${body}</section>`;}
function rerenderCard(id){const el=$(`[data-card="${id}"]`);if(!el||!el.isConnected||!el.parentNode)return render();const dur=($('#dur-'+id)||{}).value;el.outerHTML=exCard(exById(id),logDate,stats());if(dur)$('#dur-'+id).value=dur;}

/* ---------- Đồng hồ ---------- */
function runState(){try{return JSON.parse(localStorage.getItem(RUNKEY));}catch(e){return null;}}
function setRun(r){r?localStorage.setItem(RUNKEY,JSON.stringify(r)):localStorage.removeItem(RUNKEY);}
function elapsed(r){return r?((r.pauseAt||now())-r.startAt-r.pausedMs)/1000:0;}
function vRun(){const r=runState(),timeEx=D.exercises.filter(e=>!e.hidden&&e.type==='time');
 if(r)runEx=r.exId;const cur=exById(runEx);if(!r&&(!cur||cur.type!=='time'||cur.hidden))runEx=timeEx[0]&&timeEx[0].id;
 const e=exById(runEx);if(!e)return '<p class="empty">Chưa có bộ môn tính theo thời gian. Vào Cài đặt để thêm.</p>';
 const days=stats(),ti=targetInfo(e.id,today(),days),tg=ti.v,done=days[today()]&&days[today()].ex[e.id]||0,st=!r?'idle':r.pauseAt?'paused':'running';
 if(r&&D.settings.runFull&&!fullHidden){const fb=r.pauseAt?'<button class="btn primary xl-btn" data-act="runResume">Tiếp tục</button>':'<button class="btn xl-btn" data-act="runPause">Tạm dừng</button>';
  return `<section class="runfull ${r.pauseAt?'paused':''}"><div class="lbl">${esc(e.name)}${r.pauseAt?' (tạm dừng)':''}</div><div id="clock" class="num clock">${mmss(elapsed(r))}</div>
  <div class="tgt">${tg!=null?`${ti.hold?'Giữ mức':'Mục tiêu'}: <b class="num">${mmss(tg*60)}</b>`:'Buổi đầu: đặt mốc'}</div>
  ${tg!=null?`<div class="bar"><i id="bar" data-tg="${tg}" data-done="${done}" style="width:${Math.min(100,(elapsed(r)/60+done)/tg*100)}%"></i></div>`:''}
  <div class="run-btns">${fb}<button class="btn primary xl-btn" data-act="runFinish">Kết thúc</button></div>
  <button class="min" data-act="fullHide">Thu nhỏ</button></section>`;}
 const btns={idle:'<button class="btn primary xl-btn" data-act="runStart">Bắt đầu</button>',
  running:'<button class="btn xl-btn" data-act="runPause">Tạm dừng</button><button class="btn danger xl-btn" data-act="runFinish">Kết thúc</button>',
  paused:'<button class="btn primary xl-btn" data-act="runResume">Tiếp tục</button><button class="btn danger xl-btn" data-act="runFinish">Kết thúc</button>'}[st];
 return `<section class="runner ${st}">
 <select data-on="runEx" ${r?'disabled':''} aria-label="Bộ môn">${timeEx.concat(r&&!timeEx.includes(e)?[e]:[]).map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <div id="clock" class="num clock" aria-live="off">${mmss(elapsed(r))}</div>
 <p class="target">${tg!=null?`${ti.hold?'Giữ mức hôm nay':'Mục tiêu hôm nay'}: <b class="num">${mmss(tg*60)}</b>`:'Buổi đầu tiên: chạy thoải mái để đặt mốc'}${done?`<br><span class="muted small">Đã ghi hôm nay: ${mmss(done*60)}</span>`:''}</p>
 ${tg!=null?`<div class="bar"><i id="bar" data-tg="${tg}" data-done="${done}" style="width:${Math.min(100,(elapsed(r)/60+done)/tg*100)}%"></i></div>`:''}
 <div class="run-btns">${btns}</div>
 ${r&&D.settings.runFull?'<button class="btn full" data-act="fullShow">Mở toàn màn hình</button>':''}
 <label class="switch"><input type="checkbox" data-on="wake" ${D.settings.wakeLock?'checked':''}> Giữ màn hình sáng khi đang chạy</label>
 <label class="switch"><input type="checkbox" data-on="sound" ${D.settings.targetSound?'checked':''}> Âm báo khi đạt mục tiêu</label>
 <label class="switch"><input type="checkbox" data-on="runfull" ${D.settings.runFull?'checked':''}> Màn hình chạy toàn màn hình</label>
 <label class="switch"><input type="checkbox" data-on="iostimer" ${D.settings.iosTimer?'checked':''}> Bật Hẹn giờ iPhone (màn hình khóa)</label>
 ${r&&!r.pauseAt&&D.settings.lockScreen&&!(la&&!la.paused)?'<button class="btn full" data-act="lockStart">Hiện lại trên màn hình khóa</button>':''}
 <p class="muted small">Đồng hồ tính theo mốc giờ thực: khóa máy hoặc đóng app, mở lại vẫn đúng thời gian.</p></section>`;}
/* ---------- Màn hình khóa: khung Đang phát ---------- */
let fullHidden=false,la=null,lastLock=0,lastMeta='',iconPNG='icon.svg';
function silentWav(sec){const sr=8000,n=sr*sec,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
 for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
function lockOn(){if(!D.settings.lockScreen||!('mediaSession' in navigator))return;try{
 if(!la){la=new Audio(silentWav(10));la.loop=true;la.setAttribute('playsinline','');}
 la.play().catch(()=>{});lastMeta='';lockUpdate();const ms=navigator.mediaSession;
 ms.setActionHandler('play',()=>ACT.runResume());ms.setActionHandler('pause',()=>ACT.runPause());
 for(const a of ['seekbackward','seekforward','previoustrack','nexttrack','seekto'])try{ms.setActionHandler(a,null);}catch(e){}}catch(e){}}
function lockOff(){try{if(la)la.pause();if('mediaSession' in navigator){navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none';}}catch(e){}lastMeta='';}
function lockUpdate(){const r=runState();if(!r||!la||!('mediaSession' in navigator))return;lastLock=now();try{
 const ms=navigator.mediaSession,s=elapsed(r),e=exById(r.exId),a=r.alertAt,dur=a&&s<a?a:Math.max(10800,Math.ceil(s)+60);
 const title=(e?e.name:'Chạy bộ')+(r.pauseAt?' (tạm dừng)':''),artist=a?(s<a?'Mục tiêu hôm nay '+mmss(a):'Đã đạt mục tiêu, đang vượt mốc'):'Thêm 1',key=title+artist;
 if(key!==lastMeta){ms.metadata=new MediaMetadata({title,artist,album:'Thêm 1',artwork:[{src:iconPNG,sizes:'512x512',type:'image/png'}]});lastMeta=key;}
 ms.playbackState=r.pauseAt?'paused':'playing';if(ms.setPositionState)ms.setPositionState({duration:dur,playbackRate:1,position:Math.min(Math.max(0,s),dur)});}catch(e){}}

function checkAlert(){const r=runState();if(!r||r.pauseAt||r.alertAt==null||r.alerted)return;const s=elapsed(r);if(s<r.alertAt)return;

  <div class="two"><button class="btn" data-act="closeModal">Hủy</button><button class="btn primary" data-act="saveEdit" data-id="${l.id}">Lưu thay đổi</button></div>`);},
 saveEdit:b=>{const l=D.logs.find(x=>x.id===b.dataset.id),e=exById(l.exerciseId),m=num($('#ed-min').value);
  if(e.type==='reps'){const s=[...document.querySelectorAll('.ed-set')].map(x=>Number(x.value)).filter(n=>n>0);if(!s.length)return toast('Nhập ít nhất 1 hiệp');l.sets=s;l.durEst=!(m>0);l.durationSec=m>0?Math.round(m*60):sum(s)*e.secPerRep;}
  else{if(!(m>0))return toast('Nhập số phút');l.durationSec=Math.round(m*60);if(e.intensities){l.intensity=$('#ed-int').value;l.met=e.intensities[l.intensity];}}
  const d=$('#ed-date').value;if(d&&d<=today())l.date=d;l.updatedAt=now();l.kcal=round1(kcalOf(l));save();closeModal();render();toast('Đã lưu thay đổi');},
 askText:b=>{const i=$(b.dataset.target);if(!i)return;const v=prompt(b.dataset.label||'Nhập',i.value||'');if(v==null)return;i.value=v.trim();i.dispatchEvent(new Event('change',{bubbles:true}));if(v.trim())toast('Đã nhập: '+v.trim());},
 edAddSet:()=>{const c=$('#ed-sets'),last=[...c.querySelectorAll('.ed-set')].pop();c.insertAdjacentHTML('beforeend',`<select class="ed-set" style="width:auto">${opts(1,300,1,last?Number(last.value):10,0)}</select>`);},
 edRmSet:()=>{const a=[...document.querySelectorAll('.ed-set')];if(a.length>1)a.pop().remove();else toast('Cần ít nhất 1 hiệp');},
 delLog:b=>{if(!confirm('Xóa bản ghi này?'))return;delRec('logs',b.dataset.id);save();render();toast('Đã xóa');},
 histMore:()=>{histLimit+=30;render();},
 weightOpen:()=>openModal(`<h2>Cập nhật cân nặng</h2><div class="two"><label class="fld">Ngày<input type="date" id="w-date" value="${today()}" max="${today()}"></label><label class="fld">Cân nặng (kg)<select id="w-kg">${kgOpts(weightAt(today())||70)}</select></label></div>
  <p class="muted small">Calo từ ngày này trở đi tính theo cân nặng mới. Bản ghi trước đó giữ nguyên.</p><div class="two"><button class="btn" data-act="closeModal">Hủy</button><button class="btn primary" data-act="weightSave">Lưu cân nặng</button></div>`),
 weightSave:()=>{const kg=num($('#w-kg').value),d=$('#w-date').value||today();if(!(kg>=20&&kg<=300))return toast('Cân nặng nhập từ 20 đến 300 kg');
  const ex=D.weights.find(w=>w.date===d);if(ex){ex.kg=kg;ex.updatedAt=now();}else D.weights.push({id:uid(),date:d,kg,updatedAt:now()});
  save();closeModal();render();toast('Đã cập nhật '+fmt(kg,1)+' kg từ '+fmtDate(d));},
 delWeight:b=>{if(D.weights.length<=1)return toast('Cần giữ ít nhất 1 mốc cân nặng');if(!confirm('Xóa mốc cân nặng này?'))return;delRec('weights',b.dataset.id);save();render();},
 profileSave:()=>{const p=readProfile();if(!p)return;D.profile=p;save();toast('Đã lưu hồ sơ');render();},
 onboardSave:()=>{const p=readProfile();if(!p)return;const w=num($('#p-w').value);if(!(w>=20&&w<=300))return bad('p-w','Nhập cân nặng từ 20 đến 300 kg, ví dụ 77');
  D.profile=p;D.weights.push({id:uid(),date:today(),kg:w,updatedAt:now()});save();go('dash');toast('Đã lưu hồ sơ');},
 restoreGist:async()=>{const t=$('#r-tok').value.trim(),g=$('#r-gid').value.trim();if(!t||!g)return toast('Nhập token và Gist ID');
  localStorage.setItem(TOKKEY,t);localStorage.setItem(GISTKEY,g);await sync(true);if(D.profile)go('dash');},
 exAdd:()=>openModal(exForm(null)),
 exEdit:b=>openModal(exForm(exById(b.dataset.id))),
 preset:b=>{const p=MET_PRESETS[Number(b.dataset.i)];$('#x-name').value=p[0];$('#x-met').value=p[1];$('#x-type').value=p[2];$('#x-spr').value=p[3]||2;},
 exSave:b=>{const name=$('#x-name').value.trim(),met=num($('#x-met').value),spr=num($('#x-spr').value)||0,inc=num($('#x-inc').value),id=b.dataset.id,e=id&&exById(id);
  if(!name)return toast('Nhập tên bộ môn');if(!(e&&e.intensities)&&!(met>0))return toast('MET phải lớn hơn 0');if(!(inc>0))return toast('Mức tăng phải lớn hơn 0');
  const type=e?e.type:$('#x-type').value;if(type==='reps'&&!(spr>0))return toast('Nhập số giây mỗi lần');
  if(e){e.name=name;if(!e.intensities)e.met=met;e.secPerRep=spr;e.increment=inc;e.updatedAt=now();}
  else D.exercises.push({id:uid(),name,type,met,secPerRep:type==='reps'?spr:0,increment:inc,hidden:false,updatedAt:now()});
  save();closeModal();render();toast('Đã lưu bộ môn');},
 exHide:b=>{const e=exById(b.dataset.id);e.hidden=!e.hidden;e.updatedAt=now();save();render();},
 goalSave:()=>{const v=Number($('#goal').value);if(!(v>=10))return toast('Mục tiêu tối thiểu 10 phút');D.settings.weeklyGoalMin=v;D.settings.updatedAt=now();save();toast('Đã lưu mục tiêu tuần');},
 tokenSave:()=>{const t=$('#tok').value.trim(),g=$('#gid').value.trim();if(t)localStorage.setItem(TOKKEY,t);g?localStorage.setItem(GISTKEY,g):localStorage.removeItem(GISTKEY);toast('Đã lưu cài đặt đồng bộ');render();},
 syncNow:()=>sync(true),
 tokenClear:()=>{if(!confirm('Xóa token khỏi máy này?'))return;localStorage.removeItem(TOKKEY);render();},
 exportJSON:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='them1-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);},
 importJSON:()=>$('#file').click(),
 monthShift:b=>{const [y,m]=repMonth.split('-').map(Number),n=ymd(new Date(y,m-1+Number(b.dataset.n),1)).slice(0,7);if(n<=today().slice(0,7))repMonth=n;render();},
 restToggle:b=>{const d=b.dataset.date,ex=D.rests.find(r=>r.date===d);
  if(ex){delRec('rests',ex.id);save();render();return toast('Đã bỏ ngày nghỉ');}
  if(D.logs.some(l=>l.date===d))return toast('Ngày này đã có buổi tập');
  if(restsInWeek(d,d)>=1)return toast('Tuần này đã dùng 1 ngày nghỉ');
  D.rests.push({id:uid(),date:d,updatedAt:now()});save();render();toast('Đã đánh dấu ngày nghỉ');},
 reminderICS:()=>{const tm=(D.settings.reminderTime||'19:00').split(':').map(Number),n=new Date(),st=new Date(n.getFullYear(),n.getMonth(),n.getDate(),tm[0],tm[1]);if(st<=n)st.setDate(st.getDate()+1);
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00',en=new Date(st.getTime()+15*60000),u=new Date(),url=location.href.split('#')[0];
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Them1//VI','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:them1-nhac-tap@them1','DTSTAMP:'+u.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+f(st),'DTEND:'+f(en),'RRULE:FREQ=DAILY',
   'SUMMARY:Tập Thêm 1 hôm nay','DESCRIPTION:Mở app ghi kết quả: '+url,'URL:'+url,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Đến giờ tập. Hôm nay thêm 1 chút!','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='nhac-tap-them1.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  toast('Chọn "Thêm vào Lịch" để lưu nhắc lúc '+D.settings.reminderTime);}
};
const ON={
 logDate:t=>{logDate=t.value&&t.value<=today()?t.value:today();render();},
 chartEx:t=>{chartEx=t.value;render();},
 runEx:t=>{runEx=t.value;render();},
 setsText:t=>{const dr=draft[t.dataset.ex],s=parseSets(t.value);if(!dr||s.join('-')===dr.sets.join('-'))return;dr.sets=s;setTimeout(()=>rerenderCard(t.dataset.ex),0);},
 sound:t=>{D.settings.targetSound=t.checked;D.settings.updatedAt=now();save();if(t.checked){audioInit();beep();}},
 hold:t=>{D.settings.holdRule=t.checked;D.settings.updatedAt=now();save();toast(t.checked?'Đã bật giữ mức':'Đã tắt giữ mức');},
 lock:t=>{D.settings.lockScreen=t.checked;D.settings.updatedAt=now();save();const r=runState();if(t.checked&&r&&!r.pauseAt)lockOn();else if(!t.checked)lockOff();render();},
 iostimer:t=>{D.settings.iosTimer=t.checked;D.settings.updatedAt=now();save();if(t.checked)toast('Nhớ tạo Phím tắt "'+D.settings.shortcutName+'"');},
 runfull:t=>{D.settings.runFull=t.checked;D.settings.updatedAt=now();save();fullHidden=false;render();},
 ftm:t=>{const v=Number(t.value);if(v>=1){D.settings.firstTimerMin=Math.round(v);D.settings.updatedAt=now();save();}},
 scName:t=>{if(t.value.trim()){D.settings.shortcutName=t.value.trim();D.settings.updatedAt=now();save();}},
 remTime:t=>{if(t.value){D.settings.reminderTime=t.value;D.settings.updatedAt=now();save();}},
 wake:t=>{D.settings.wakeLock=t.checked;D.settings.updatedAt=now();save();const r=runState();t.checked&&r&&!r.pauseAt?wakeOn():wakeOff();},
 import:t=>{const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let R;try{R=JSON.parse(rd.result);}catch(e){R=null;}t.value='';
  if(!R||!R.schemaVersion)return toast('File không đúng định dạng của app');if(!confirm('Gộp dữ liệu từ file vào app? Bản ghi mới hơn sẽ được giữ.'))return;
  merge(R);save();render();toast('Đã nhập dữ liệu');};rd.readAsText(f);}
};

/* ---------- Đồng bộ GitHub Gist ---------- */
function merge(R){if(!R||!R.schemaVersion)return;if(!Array.isArray(D.rests))D.rests=[];const tomb={};
 for(const t of [...D.deleted,...(R.deleted||[])])if(!(tomb[t.id]>=t.updatedAt))tomb[t.id]=t.updatedAt;
 D.deleted=Object.keys(tomb).map(id=>({id,updatedAt:tomb[id]}));
 for(const k of ['weights','exercises','logs','rests']){const m={};for(const x of [...D[k],...(R[k]||[])]){const o=m[x.id];if(!o||(x.updatedAt||0)>(o.updatedAt||0))m[x.id]=x;}
  D[k]=Object.values(m).filter(x=>!(tomb[x.id]>=(x.updatedAt||0)));}
 for(const k of ['profile','settings'])if(R[k]&&(!D[k]||(R[k].updatedAt||0)>(D[k].updatedAt||0)))D[k]=R[k];migrate();}
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:{'Authorization':'Bearer '+localStorage.getItem(TOKKEY),'Accept':'application/vnd.github+json','Content-Type':'application/json'}}));
 if(!r.ok)throw new Error(r.status===401?'Token không hợp lệ hoặc đã hết hạn':r.status===404?'Không tìm thấy Gist. Kiểm tra Gist ID và quyền gist của token':'GitHub báo lỗi '+r.status);return r.json();}
let syncTimer=null,syncing=false;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),2000);}
async function sync(manual){if(!localStorage.getItem(TOKKEY)){if(manual)toast('Chưa nhập GitHub token');return;}
 if(!navigator.onLine){setBadge('Chờ mạng để đồng bộ');if(manual)toast('Đang offline. App sẽ tự đồng bộ khi có mạng.');return;}
 if(syncing)return;syncing=true;setBadge('Đang đồng bộ…');
 try{const id=localStorage.getItem(GISTKEY);
  if(id){const g=await gh('/gists/'+id),f=g.files&&g.files[GFILE];if(f){const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;merge(JSON.parse(txt));}
   await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(D)}}})});}
  else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Thêm 1 – dữ liệu tập luyện',public:false,files:{[GFILE]:{content:JSON.stringify(D)}}})});localStorage.setItem(GISTKEY,g.id);}
  save(false);localStorage.removeItem(DIRTY);localStorage.setItem(LASTSYNC,String(now()));setBadge('');if(manual)toast('Đã đồng bộ');if(!isEditing())render();
 }catch(e){setBadge('Chưa đồng bộ được');if(manual)toast(e.message||'Không kết nối được GitHub');}finally{syncing=false;}}

/* ---------- Khởi động ---------- */
function drawIcon(px){const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d'),k=px/180;x.scale(k,k);
 x.fillStyle='#111111';x.fillRect(0,0,180,180);x.fillStyle='#FF3B44';x.fillRect(28,82,58,16);x.fillRect(49,61,16,58);
 x.fillRect(112,46,18,88);x.beginPath();x.moveTo(116,46);x.lineTo(116,66);x.lineTo(94,77);x.lineTo(94,58);x.closePath();x.fill();return c.toDataURL('image/png');}
function makeAppleIcon(){try{$('#appleIcon').href=drawIcon(180);iconPNG=drawIcon(512);}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e);}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.on;if(k&&ON[k])ON[k](t);});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#modal').dataset.lock)closeModal();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();const r=runState();if(r&&!r.pauseAt)wakeOn();}});
window.addEventListener('online',()=>{if(localStorage.getItem(DIRTY))sync(false);setBadge('');});
window.addEventListener('storage',e=>{if(e.key===KEY){load();if(!isEditing())render();}});
setInterval(tick,250);
load();makeAppleIcon();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
go(runState()?'run':'dash');
if(localStorage.getItem(TOKKEY))sync(false);
{const r=runState();if(r&&!r.pauseAt)wakeOn();}
</script>
